name: weekly-tests

on:
  schedule:
    - cron: "0 1 * * 0"  # Sunday 01:00 UTC
  workflow_dispatch:

jobs:
  full-suite:
    name: whole suite, slow tests included
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - name: pytest (known failures deselected)
        run: |
          deselect=$(sed -e 's/#.*//' -e '/^\s*$/d' tests/known-failures.txt | awk '{print "--deselect=" $1}')
          uv run pytest -q -p no:cacheprovider -m "not live and not browser" $deselect tests
