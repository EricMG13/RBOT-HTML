name: checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  changed-code:
    name: changed code passes ruff, format, complexity and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - run: uv run python tools/quality_gate.py --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"

  fast-tests:
    name: fast tests and page logic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test apps/issuer-library/credit_os/web/reader.test.cjs apps/issuer-library/credit_os/web/static.test.cjs apps/issuer-library/credit_os/web/calendar.test.cjs apps/issuer-library/credit_os/web/changes.test.cjs
      - name: pytest (known failures deselected)
        run: |
          deselect=$(sed -e 's/#.*//' -e '/^\s*$/d' tests/known-failures.txt | awk '{print "--deselect=" $1}')
          uv run pytest -q -p no:cacheprovider -m "not live and not browser" $deselect \
            tests/test_library_index.py tests/test_update_library.py \
            tests/test_issuer_library_packaging.py tests/test_reader_summary.py \
            tests/test_credit_os_catalogue.py tests/test_credit_os_store.py \
            tests/test_cpos_launch.py tests/test_cpos_facilities.py tests/model \
            tests/test_credit_os_chips.py tests/test_quality_gate.py tests/test_work_pc_delta.py \
            tests/test_inbox_activity.py tests/test_inbox_filing.py \
            tests/test_inbox_layout.py tests/test_inbox_runs.py tests/test_inbox_scheduler.py \
            tests/test_run_start_submissions.py tests/test_run_start_prior.py \
            tests/test_run_start_scheduler.py \
            tests/test_run_start_service.py tests/test_run_start_page.py \
            tests/test_context_module_options.py \
            tests/test_handoff_loop.py tests/test_context_form.py \
            tests/test_library_reader_refs.py \
            tests/test_changes.py tests/test_citation_markers.py \
            tests/test_web_search_scope.py tests/test_prose_checks.py
